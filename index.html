<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BookLibrary — Every book, verified</title>

<body>
<header id="masthead">
  <div id="brand">
    <div id="plate">BOOK&thinsp;·&thinsp;LIBRARY</div>
    <h1>Find where you can actually read a book.</h1>
    <p class="sub">Search Internet Archive texts. Page counts, ratings and access verified live.</p>
  </div>
  <div id="searchbar">
    <input id="q" type="search" placeholder="Title and author — e.g. High Output Management Grove" autocomplete="off" autofocus>
  </div>
  <div id="try">Try: <button data-try="High Output Management">High Output Management</button><button data-try="Lord of the Flies">Lord of the Flies</button><button data-try="Pride and Prejudice">Pride and Prejudice</button></div>
  <div id="status" role="status"></div>
</header>
<main id="results"></main>
<script src="app.js?v=20260912h"></script>
